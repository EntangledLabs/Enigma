{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Box Management{% endblock %}</h1>
{% endblock %}

<div>
    <form id="boxform">
        <label for="name">Box Name</label>
        <input name="name" id="name" required>
        <label for="identifier">Identifier (fourth octet)</label>
        <input name="identifier" id="identifier" required type="number" min="2" max="255">
        <label for=""></label>
    </form>
</div>
